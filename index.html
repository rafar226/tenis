<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080b18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Neón Arcade</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./arcade.css" />
  </head>
  <body>
    <main class="arcade">
      <header class="hero">
        <div class="eyebrow"><span></span> ELEGÍ TU JUEGO</div>
        <h1>NEÓN <em>ARCADE</em></h1>
        <p>Juegos rápidos para compartir la pantalla.</p>
      </header>

      <section class="games" aria-label="Juegos disponibles">
        <a class="game-card pong" href="./pong.html">
          <span class="number">01</span>
          <div class="preview" aria-hidden="true"><i class="paddle left"></i><i class="ball"></i><i class="paddle right"></i></div>
          <div class="info"><small>1–2 JUGADORES</small><h2>NEÓN <em>PONG</em></h2><p>Deslizá. Golpeá. Ganá.</p></div>
          <b>JUGAR <span>→</span></b>
        </a>

        <a class="game-card snake" href="./snake.html">
          <span class="number">02</span>
          <div class="preview" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><strong></strong></div>
          <div class="info"><small>1–2 JUGADORES</small><h2>NEÓN <em>SNAKE</em></h2><p>Deslizá. Crecé. Sobreviví.</p></div>
          <b>JUGAR <span>→</span></b>
        </a>
      </section>

      <footer><span>2 JUEGOS DISPONIBLES</span><i></i><span>FUNCIONA SIN CONEXIÓN</span></footer>
    </main>
    <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
  </body>
</html>
